<!DOCTYPE html><html><head><meta charset="utf-8"><title>ACE debug</title></head><body>
<pre id="log" style="white-space:pre-wrap;font:12px monospace"></pre>
<script src="gradio.js"></script><script src="lyrics.js"></script><script src="music.js"></script><script src="ace.js"></script>
<script>
const log=(...a)=>{document.getElementById('log').textContent+=a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ')+'\n'};
const short=v=>{try{const s=JSON.stringify(v);return s&&s.length>300?s.slice(0,300)+'…':s}catch(e){return String(v)}};
(async()=>{
 try{
  const t0=Date.now();
  const c=await GradioClient.Client.connect('ACE-Step/Ace-Step-v1.5');
  log('connected',(Date.now()-t0)+'ms');
  const api=await c.view_api();
  const ep=api.named_endpoints['/generation_wrapper'];
  log('has generation_wrapper:',!!ep,'nparams',ep&&ep.parameters.length,'nreturns',ep&&ep.returns.length);
  ep.parameters.forEach((p,i)=>log('P'+i,p.label,'|',p.component,'| def:',short(p.parameter_default),p.parameter_has_default));
  ep.returns.forEach((p,i)=>log('R'+i,p.label,'|',p.component));
  if(location.hash!=='#run') {log('DONE-INFO');return;}
  const s=Lyrics.compose({occasion:'sinhnhat',relation:'bangai',sender:'nam',name:'Hồng',traits:'Em hiền lành hay cười',story:'Lần đầu gặp nhau dưới mưa ở Đà Lạt',message:'Chúc em sinh nhật vui',seed:3});
  const secs=s.sections.slice(0,2);
  const lyrics=Ace.lyricsFor(secs);
  const vals={caption:'Vietnamese ballad, emotional, soft piano, male vocal',lyrics,lang:'vi',duration:40,bpm:72};
  // reuse ace.js mapping by calling generate with logging
  const args=ep.parameters.map(p=>{const l=(p.label||'').trim();const def=p.parameter_has_default?p.parameter_default:null;
      if(/^song description$/i.test(l))return vals.caption; if(/^prompt$/i.test(l))return vals.caption; if(/^lyrics$/i.test(l))return vals.lyrics;
      if(/^vocal language/i.test(l))return 'vi'; if(/audio duration/i.test(l))return 40;
      if(/^batch size$/i.test(l))return 1; if(/^random seed$/i.test(l))return true; if(/^audio format$/i.test(l))return 'mp3';
      if(/^get lrc$/i.test(l))return true; return def;});
  log('ARGS',short(args.slice(0,17)));
  const job=c.submit('/generation_wrapper', args, undefined, undefined, true);
  for await (const ev of job){
    if(ev.type==='data'){ log('DATA n='+ev.data.length); ev.data.forEach((d,i)=>{ if(d!==null&&d!==''&&!(Array.isArray(d)&&!d.length)) log('  D'+i,short(d)); }); }
    else log('EV',ev.type,ev.stage||'',short(Object.assign({},ev,{data:undefined})));
  }
  log('ITER-END');
  try{ const r=await c.predict('/generation_wrapper', args); log('PREDICT', short(r.data&&r.data.slice(0,12))); }catch(e){ log('PREDICT-ERR', short(e), String(e&&e.message)); }
  log('END',(Date.now()-t0)+'ms');
 }catch(e){log('ERROR',String(e&&e.message||e),short(e))}
})();
</script></body></html>
