plugins { id 'com.android.application' }

def vCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'io.github.minhcell.baihattang'
    compileSdk 34
    defaultConfig {
        applicationId "io.github.minhcell.baihattang"
        minSdk 23
        targetSdk 34
        versionCode vCode
        versionName "1.0." + vCode
    }
    signingConfigs {
        release {
            storeFile file("baihattang.jks")
            storePassword "bht123456"
            keyAlias "baihattang"
            keyPassword "bht123456"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['js', 'html'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
